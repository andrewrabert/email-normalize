name: Testing
on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'docs/**'
      - 'setup.*'
      - '*.md'
      - '*.rst'
    tags-ignore: ["*"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    container:
      image: python:${{ matrix.python }}-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OS dependencies
        run: apk --update add gcc libffi-dev linux-headers make musl-dev

      - name: Install uv
        if: matrix.python != '3.9'
        uses: astral-sh/setup-uv@v7

      - name: Install testing dependencies (uv)
        if: matrix.python != '3.9'
        run: uv pip install --system -e '.[testing]'

      - name: Install testing dependencies (pip)
        if: matrix.python == '3.9'
        run: pip3 --no-cache-dir install -e '.[testing]'

      - name: Create build directory
        run: mkdir build

      - name: Run flake8 tests
        run: flake8

      - name: Run tests
        run: coverage run

      - name: Output coverage
        run: coverage report && coverage xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v1.0.2
        if: github.event_name == 'push' && github.repository == 'gmr/email-normalize'
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: build/coverage.xml
          flags: unittests
          fail_ci_if_error: true
